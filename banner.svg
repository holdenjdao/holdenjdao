<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Holden Dao — a continuous-time convolution animating on an oscilloscope">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a151b"/>
      <stop offset="1" stop-color="#0e2129"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="0" y="160" width="0" height="80">
        <animate attributeName="width" from="0" to="1200" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- graticule -->
  <path d="M60 0V280M120 0V280M180 0V280M240 0V280M300 0V280M360 0V280M420 0V280M480 0V280M540 0V280M600 0V280M660 0V280M720 0V280M780 0V280M840 0V280M900 0V280M960 0V280M1020 0V280M1080 0V280M1140 0V280" stroke="#152b36" stroke-width="1"/>
  <path d="M0 56H1200M0 112H1200M0 168H1200M0 224H1200" stroke="#152b36" stroke-width="1"/>

  <!-- scope labels -->
  <text x="24" y="34" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#4fb3ce" opacity="0.85">CH1  2V/div</text>
  <text x="1176" y="34" text-anchor="end" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#4fb3ce" opacity="0.85">t: 1ms/div   TRIG &#9650;</text>

  <!-- name -->
  <text x="600" y="112" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="54" font-weight="700" letter-spacing="8" fill="#e6edf3">HOLDEN DAO</text>
  <text x="600" y="150" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="18" fill="#4fb3ce">&gt; rf systems &#183; embedded firmware &#183; ai infrastructure<tspan fill="#4fb3ce">&#9615;<animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></tspan></text>

  <!-- baseline -->
  <path d="M0 230 H1200" stroke="#1d3d4c" stroke-width="1.5"/>

  <!-- f(tau): fixed input pulse -->
  <path d="M450 230 V185 H650 V230 Z" fill="#4fb3ce" fill-opacity="0.07" stroke="#33788c" stroke-width="2" stroke-linejoin="round"/>
  <text x="538" y="177" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#33788c">f(&#964;)</text>

  <!-- y(t) = (f * g)(t): revealed in sync with the kernel's leading edge -->
  <g clip-path="url(#reveal)">
    <path d="M0 230 H450 C485 203 560 192 650 190 C690 216 745 227 810 229.5 H1200" fill="none" stroke="#9fdcec" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
    <text x="668" y="205" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#9fdcec">y(t)</text>
  </g>

  <!-- g(t - tau): flipped exponential kernel sliding in t -->
  <g>
    <path d="M-150 229 C-95 226 -48 212 0 182 V230 H-150 Z" fill="#4fb3ce" fill-opacity="0.14" stroke="#4fb3ce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="-96" y="172" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#4fb3ce">g(t&#8722;&#964;)</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1200 0" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- the integral -->
  <text x="24" y="264" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#3d8ba1">y(t) = (f &#8727; g)(t) = &#8747; f(&#964;) g(t&#8722;&#964;) d&#964;</text>
</svg>
