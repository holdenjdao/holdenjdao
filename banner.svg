<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Holden Dao — RF, embedded systems, AI infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset="1" stop-color="#0d141c"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9a5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d9a5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00d9a5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- graticule -->
  <path d="M60 0V280M120 0V280M180 0V280M240 0V280M300 0V280M360 0V280M420 0V280M480 0V280M540 0V280M600 0V280M660 0V280M720 0V280M780 0V280M840 0V280M900 0V280M960 0V280M1020 0V280M1080 0V280M1140 0V280" stroke="#16202b" stroke-width="1"/>
  <path d="M0 56H1200M0 112H1200M0 168H1200M0 224H1200" stroke="#16202b" stroke-width="1"/>

  <!-- scope labels -->
  <text x="24" y="34" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#3fb950" opacity="0.85">CH1  2V/div</text>
  <text x="1176" y="34" text-anchor="end" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#3fb950" opacity="0.85">t: 1ms/div   TRIG &#9650;</text>

  <!-- name -->
  <text x="600" y="118" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="54" font-weight="700" letter-spacing="8" fill="#e6edf3">HOLDEN DAO</text>
  <text x="600" y="158" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="18" fill="#00d9a5">&gt; rf systems &#183; embedded firmware &#183; ai infrastructure<tspan fill="#00d9a5">&#9615;<animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></tspan></text>

  <!-- waveform: sine burst, digital pulses, carrier, noise -->
  <path d="M0 225 H100 q20 -56 40 0 q20 56 40 0 q20 -56 40 0 q20 56 40 0 q20 -56 40 0 q20 56 40 0 h30 v-40 h40 v40 h30 v-40 h40 v40 h30 h30 q25 -70 50 0 q25 70 50 0 q25 -70 50 0 q25 70 50 0 h30 q10 -30 20 0 q10 30 20 0 q10 -30 20 0 q10 30 20 0 q10 -30 20 0 q10 30 20 0 q10 -30 20 0 q10 30 20 0 h30 v-40 h30 v40 h30 H1200" fill="none" stroke="#00d9a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- sweep -->
  <rect x="0" y="0" width="140" height="280" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="-140 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
